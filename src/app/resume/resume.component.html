<div class="resume-page">

  <div class="resume-header">
    <div class="resume-title">RESUME</div>

    <div class="resume-actions">
      <button class="btn" type="button" (click)="openInNewTab()">OPEN</button>
      <button class="btn btn--primary" type="button" (click)="download()">DOWNLOAD</button>
    </div>
  </div>

  <div class="resume-window" role="region" aria-label="Resume viewer">
    <iframe
      class="resume-frame"
      [src]="resumeSafeUrl"
      title="Resume PDF"
      loading="lazy"
    ></iframe>
  </div>

  <div class="resume-footnote">
    Tip: Use your browser’s zoom controls for a closer look.
  </div>

</div>
