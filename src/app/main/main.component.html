

<!-- HERO -->
<section class="bw-hero bw-reveal">
  <div class="bw-hero__bg" [style.backgroundImage]="'url(' + heroImage + ')'"></div>
  <div class="bw-hero__overlay"></div>

  <div class="bw-hero__content">
    <div class="bw-hero__kicker">BEYOND WORK</div>
    <h1 class="bw-hero__title">Now You Say My Name</h1>
    <div class="bw-hero__sub">Welcome to my space</div>
  </div>
</section>

<!-- ZIGZAG SECTIONS -->
<section class="bw-wrap">
  <section
    class="bw-item bw-reveal"
    *ngFor="let it of items"
    [class.reverse]="it.reverse"
  >
    <div class="bw-image">
      <img [src]="it.image" [alt]="it.imageAlt" />
    </div>

    <div class="bw-text">
      <div class="bw-title">{{ it.title }}</div>
      <p class="bw-copy">{{ it.copy }}</p>


      <div class="bw-actions" *ngIf="it.key === 'kpop'">
        <button class="bw-btn" type="button" (click)="openBlackpink()">
          OPEN BLACKPINK ON YOUTUBE
        </button>
        <div class="bw-hint">Opens the official channel in a new tab.</div>
      </div>
    </div>
  </section>


</section>
